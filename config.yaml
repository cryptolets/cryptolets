# Default Configurations
total_threads: 8
threads_per_process: 1

# Every run is killed when the machine has less 
# than this much memory free as an ultimate safeguard
min_free_gb: 50

# How far a run goes, which --from and --to override
frm: gen
to: rtl

# Install directories, the flow appends bin/ and other subdirectories
tools:
  catapult: "/eda/siemens/Catapult/Mgc_home"
  questa: "/eda/siemens/Questasim/questasim"
  dc: "/eda/synopsys/syn/Y-2026.03"
  prime: "/eda/synopsys/prime/Y-2026.03"
  vivado: "/eda/xilinx/2026.1/Vivado"

# tech node names must match tech_type in framework/enums.yaml
tech:
  gf12_highperf:
    lib_path: "/ip/arm/gf12/sc7p5mcpp84_base_slvt_c14/r1p0"
    catapult_lib_name: "gf12_highperf"
    catapult_lib_file: "~/gf12_libs/gf12_highperf.lib"
    lib_db: "/ip/arm/gf12/sc7p5mcpp84_base_slvt_c14/r1p0/db/sc7p5mcpp84_12lp_base_slvt_c14_tt_nominal_max_0p90v_25c.db"
    lib_verilog: "/ip/arm/gf12/sc7p5mcpp84_base_slvt_c14/r1p0/verilog/sc7p5mcpp84_12lp_base_slvt_c14.v"
    lib_verilog_defines: "+define+ARM_UD_MODEL +define+ARM_EN_X_SQUASH"
    vendor: "GlobalFoundries"
    technology: "12nm"

  fpga_vu9p:
    catapult_lib_name: "mgc_Xilinx-VIRTEX-uplus-2_beh"
    vendor: "Xilinx"
    technology: "VIRTEX-uplus"
    family: "VIRTEX-uplus"
    speed: "-2"
    part: "xcvu9p-flga2104-2-i"

  45nm:
    lib_path: "~/45nm_db"
    catapult_lib_name: "nangate-45nm_beh"
    lib_db: "~/45nm_db/NangateOpenCellLibrary_typical_ccs.db"
    vendor: "Nangate"
    technology: "045nm"
