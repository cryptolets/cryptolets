# Sweep parameters
BITWIDTH: [254, 381]
WBW: [64] # Word Bitwidth for multi-prec
TECH_TYPE: [45nm]  # gf12 45nm saed32 fpga_vu9p fpga_hbmvh1782 fpga_hbmvh1582
TARGET_II: [1]
TARGET_PERIOD: [5]  # in ns
MUL_TYPE: [MUL_SCHOOLBOOK, MUL_KARATSUBA] # MUL_NORMAL, MUL_SCHOOLBOOK, MUL_KARATSUBA
PREC_TYPE: [SINGLE_PREC]  # SINGLE_PREC, MULTI_PREC (needs CCORE_TOP: false)

# Base multiplier widths per BITWIDTH; add an entry for each swept BITWIDTH
BASE_MUL_WIDTH:
  254: [63]
  381: [47]

KAR_BASE_MUL_WIDTH:
  254: [127]
  381: [190]

# Control flags
SIM: true           # verify RTL
SYN: false
TEST: true          # test C++ code
TEST_ONLY: false    # only test C++ code with osci
NUM_TEST_SAMPLES: 1000
CCORE_TOP: true
USE_CLUSTERS: true # use use carry save adder for adder trees

# Defines order of params before project split
SWEEP_ORDER: [
  TECH_TYPE, PREC_TYPE, TARGET_PERIOD, TARGET_II,
  MUL_TYPE, BITWIDTH, WBW, BASE_MUL_WIDTH, KAR_BASE_MUL_WIDTH
  ]
