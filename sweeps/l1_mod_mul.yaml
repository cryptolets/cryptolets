sweep:
  bitwidth: [254]
  tech_type: [gf12_highperf]
  period: [1]
  ii: [1]
  mul_type: [mul_kar]
  dep_period_ratio: [1]

  base_mul_width:
    254: [63]
    255: [63]
    381: [47]
    508: [63]
    510: [63]
    762: [47]
  kar_base_mul_width:
    254: [127, 63]
    255: [127, 63]
    381: [190, 95, 47]
    508: [254, 127, 63]
    510: [255, 127, 63]
    762: [381, 190, 95, 47]

  # fixed bakes the constant into the hardware, var takes it as a port
  q_type: [var_q]
  redc_type: [var_rc]

  # Which modular reduction the multiply uses
  mred: [mred_mont]

  # Field modulus. Omit both to get a random prime of width bitwidth.
  curve: [arb_curve]   # name from reference/curves.yaml
  field: [base]               # which modulus of that curve to use

flags:
  num_test_samples: 100
  syn_sel: all            # all, pareto, small_fast (smallest and fastest)
