sweep:
  bitwidth: [254]
  tech_type: [gf12_highperf]
  period: [1]
  ii: [1]
  mul_type: [mul_nor, mul_kar, mul_sb]
  dep_period_ratio: [1]

  base_mul_width:
    32: [32]
    254: [63]
    255: [63]
    381: [47]
    508: [63]
    510: [63]
    762: [47]
  kar_base_mul_width:
    32: [32]
    254: [127, 63]
    255: [127, 63]
    381: [190, 95, 47]
    508: [254, 127, 63]
    510: [255, 127, 63]
    762: [381, 190, 95, 47]

  # fixed bakes the constant into the hardware, var takes it as a port
  q_type: [fixed_q, var_q]
  rc_type: [fixed_rc, var_rc]

  # Which modular reduction the multiply uses
  mred: [mred_mont]

  # Which doubling formula, which the curve's a decides
  pdbl_form: [pdbl_a0]

  # field; arb_field is a random prime of the bitwidth
  field: [bn254_base]

flags:
  num_test_samples: 1000
  syn_sel: all            # all, pareto, small_fast (smallest and fastest)
  bb_syn_metrics: false   # blackbox children with their DC area/delay, not Catapult's estimate
  syn_passes: 1           # compile_ultra passes: one full, the rest incremental
