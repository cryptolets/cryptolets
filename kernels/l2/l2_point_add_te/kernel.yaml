# Deps to reuse as packaged RTL. The rest are inlined.
blackbox: [l1_mod_mul, l1_mod_cmul]

# The parameters that change the hardware, which name a design's build directory
design_key: [bitwidth, tech_type, period, ii, dep_period_ratio, field,
             q_type, redc_type, mred, mul_type, base_mul_width, kar_base_mul_width, padd_te_form]

# Of those, the ones that decide what this computes, so only designs that
# could replace one another are compared
kernel_key: [bitwidth, field, q_type, redc_type, padd_te_form]

# Kernel specific stage scripts
stages:
  compile: |
    set_ii $ii
    adder_tree_opt $tech_type
